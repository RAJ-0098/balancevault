services:
  # ── Backend (Node.js Web Service) ──────────────────────────────────────────
  - type: web
    name: balancevault-backend
    runtime: node
    rootDir: packages/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: REDIS_URL
        sync: false          # set in Render dashboard (Upstash)
      - key: JWT_SECRET
        generateValue: true  # Render generates a random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false          # set after frontend is deployed

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: balancevault-frontend
    runtime: static
    rootDir: packages/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to backend URL after backend is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
